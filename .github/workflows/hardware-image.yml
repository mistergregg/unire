name: Hardware Sandbox Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/hardware-pipeline/**'
      - '.github/workflows/hardware-image.yml'
  pull_request:
    paths:
      - 'experiments/hardware-pipeline/**'
      - '.github/workflows/hardware-image.yml'

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build base sandbox image
        run: |
          docker build -t unire-sandbox:latest docker/sandbox

      # ------------------------------------------------------------------------
      # VARIANT B: Small additions (OpenSCAD, CuraEngine, ADMesh, Python CAD)
      # ------------------------------------------------------------------------
      - name: Build Variant B image
        run: |
          START_TIME=$(date +%s)
          docker build --target variant-b -t unire-hardware:variant-b -f experiments/hardware-pipeline/Dockerfile.hardware .
          END_TIME=$(date +%s)
          BUILD_DURATION=$((END_TIME - START_TIME))
          SIZE=$(docker images unire-hardware:variant-b --format "{{.Size}}")
          echo "B_BUILD_TIME=${BUILD_DURATION}s" >> $GITHUB_ENV
          echo "B_SIZE=${SIZE}" >> $GITHUB_ENV

      - name: Test Variant B tools and pipeline
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace unire-hardware:variant-b sh -c '
            set -e
            echo "=== Tool Versions in Variant B ==="
            openscad --version
            CuraEngine help | head -n 3
            admesh --version
            python3 -c "import build123d, trimesh, numpy, matplotlib; print(\"build123d:\", build123d.__version__, \"trimesh:\", trimesh.__version__)"

            echo "=== Generating & Checking Enclosures in Variant B ==="
            python3 experiments/hardware-pipeline/gen_enclosure.py experiments/hardware-pipeline/examples/esp32/esp32.json /tmp/esp32
            python3 experiments/hardware-pipeline/gen_enclosure.py experiments/hardware-pipeline/examples/pizero/pizero.json /tmp/pizero
            python3 experiments/hardware-pipeline/check_enclosure.py --test

            echo "=== Testing CLI Commands ==="
            unire-mesh-check /tmp/esp32/base.stl
            unire-stl-shot /tmp/esp32/base.stl /tmp/test_shot.png 600x500
            test -s /tmp/test_shot.png
          '

      # ------------------------------------------------------------------------
      # VARIANT C: Heavy additions (KiCad, FreeCAD)
      # ------------------------------------------------------------------------
      - name: Build Variant C image
        run: |
          START_TIME=$(date +%s)
          docker build --target variant-c -t unire-hardware:variant-c -f experiments/hardware-pipeline/Dockerfile.hardware .
          END_TIME=$(date +%s)
          BUILD_DURATION=$((END_TIME - START_TIME))
          SIZE=$(docker images unire-hardware:variant-c --format "{{.Size}}")
          echo "C_BUILD_TIME=${BUILD_DURATION}s" >> $GITHUB_ENV
          echo "C_SIZE=${SIZE}" >> $GITHUB_ENV

      - name: Test Variant C tools and KiCad DRC
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace unire-hardware:variant-c sh -c '
            set -e
            echo "=== Tool Versions in Variant C ==="
            if command -v kicad-cli >/dev/null 2>&1; then
              kicad-cli --version
            else
              kicad --version
            fi
            freecad --version || freecadcmd --version || true

            echo "=== Running PCB Design Rule Check ==="
            unire-kicad-check experiments/hardware-pipeline/examples/sample.kicad_pcb
          '

      - name: Publish Build & Size Summary
        if: always()
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          # Hardware Sandbox Image Build & Verification Summary

          | Variant | Tools Added | Build Time | Measured Image Size | Verification Status |
          | :--- | :--- | :--- | :--- | :--- |
          | **Variant B (Setup B)** | OpenSCAD, CuraEngine, ADMesh, build123d, trimesh | ${{ env.B_BUILD_TIME }} | ${{ env.B_SIZE }} | PASS |
          | **Variant C (Setup C)** | B + KiCad (kicad-cli), FreeCAD | ${{ env.C_BUILD_TIME }} | ${{ env.C_SIZE }} | PASS |

          ### Verification Results:
          - Both example boards (ESP32 DevKit and Raspberry Pi Zero) generated watertight STL & STEP models.
          - Design rule verification (\`check_enclosure.py --test\`) passed all positive and intentional defect tests.
          - Slicing and mesh validation confirmed in Variant B (\`CuraEngine\`, \`admesh\`).
          - PCB design rule checking confirmed in Variant C (\`kicad-cli\`).
          EOF
